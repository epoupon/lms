name: Basic Build (macOS)

on: [pull_request]

jobs:
  build-macos:
    runs-on: macos-14
    env:
      # Make sure pkg-config can find Homebrew .pc files
      PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig
      CMAKE_PREFIX_PATH: /opt/homebrew/lib/cmake/wt

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install pkg-config cmake boost ffmpeg libconfig taglib libarchive xxhash pugixml googletest openssl wt

      - name: Configure LMS
        run: cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_UNITY_BUILD=ON \
              -DBUILD_TESTING=ON

      - name: Build LMS
        run: cmake --build build --parallel 2

      - name: Test LMS
        run: ctest --test-dir build --output-on-failure
