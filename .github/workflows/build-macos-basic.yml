name: Basic Build (macOS)

on: [pull_request]

jobs:
  build-macos:
    runs-on: macos-14
    env:
      # Make sure pkg-config can find libarchive and other Homebrew .pc files
      PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig
      CMAKE_PREFIX_PATH: /opt/homebrew

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install pkg-config cmake boost ffmpeg libconfig taglib libarchive xxhash pugixml googletest openssl

      - name: Build and install Wt from source
        run: |
          WT_VERSION=4.12.1
          git clone https://github.com/emweb/wt.git /tmp/wt
          cd /tmp/wt
          git checkout ${WT_VERSION}
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_EXAMPLES=OFF \
            -DENABLE_LIBWTTEST=OFF \
            -DCONNECTOR_FCGI=OFF
          cmake --build build --parallel 2
          sudo cmake --install build

      - name: Check pkg-config
        run: pkg-config --cflags --libs libarchive

      - name: Configure LMS
        run: cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_UNITY_BUILD=ON \
              -DBUILD_TESTING=ON \
              -DCMAKE_INCLUDE_PATH=/opt/homebrew/include \
              -DCMAKE_LIBRARY_PATH=/opt/homebrew/lib

      - name: Build LMS
        run: cmake --build build --parallel 2

      - name: Test LMS
        run: ctest --test-dir build --output-on-failure
